<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#137653">
  <meta name="description" content="Luma, hoja de cálculo local de código abierto.">
  <title>Luma · Hojas de cálculo</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./assets/xlsx.full.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="mast">
    <div class="brand"><img src="./assets/icon-192.png" alt=""><span>Luma <small>Hojas de cálculo</small></span></div>
    <span class="document" id="document-name">Libro de trabajo</span>
    <div class="mast-actions"><span id="save-status" role="status">Abriendo libro…</span><button id="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button></div>
  </header>
  <main>
    <nav class="menu" aria-label="Herramientas del libro">
      <div class="ribbon-tabs" aria-label="Secciones de herramientas">
        <button data-ribbon="file" aria-pressed="false">Archivo</button>
        <button data-ribbon="home" aria-pressed="true">Inicio</button>
        <button data-ribbon="insert" aria-pressed="false">Insertar</button>
        <button data-ribbon="data" aria-pressed="false">Datos</button>
        <button data-ribbon="view" aria-pressed="false">Vista</button>
      </div>
      <button id="toggle" aria-controls="ribbon" aria-expanded="true" aria-label="Contraer cinta" title="Contraer cinta">⌃</button>
    </nav>
    <div class="ribbon" id="ribbon" role="toolbar" aria-label="Herramientas de la hoja">
      <div class="ribbon-panel" data-panel="file" hidden>
        <div class="ribbon-group"><button id="import" class="tool-tile"><b aria-hidden="true">↥</b> Abrir archivo</button>
          <input id="import-file" type="file" accept=".xlsx,.xlsm,.xls,.csv,.ods" hidden><small>Libro</small></div>
        <div class="ribbon-group"><div><button data-export="xlsx" class="tool-tile"><b aria-hidden="true">↧</b> Exportar XLSX</button>
          <button data-export="csv" class="tool-tile"><b aria-hidden="true">≡</b> Exportar CSV</button></div><small>Exportación</small></div>
      </div>
      <div class="ribbon-panel" data-panel="home">
        <div class="ribbon-group"><div><button id="undo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
          <button id="redo" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button></div><small>Historial</small></div>
        <div class="ribbon-group"><div><button id="paste" class="tool-tile" title="Pegar (Ctrl+V)"><b aria-hidden="true">▣</b> Pegar</button>
          <span class="tool-stack"><button id="copy" title="Copiar (Ctrl+C)">⧉ Copiar</button><button id="cut" title="Cortar (Ctrl+X)">✂ Cortar</button></span></div><small>Portapapeles</small></div>
        <div class="ribbon-group"><div>
          <select id="font-size" aria-label="Tamaño de fuente"><option value="">Tamaño</option><option>10</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option></select>
          <button id="bold" title="Negrita (Ctrl+B)" aria-label="Negrita" aria-pressed="false"><strong>N</strong></button>
          <button id="italic" title="Cursiva" aria-label="Cursiva" aria-pressed="false"><i>C</i></button>
          <button id="underline" title="Subrayado" aria-label="Subrayado" aria-pressed="false"><u>S</u></button>
          <button class="swatch" id="fg" title="Color de texto" aria-label="Color de texto">A</button>
          <button class="swatch" id="bg" title="Color de relleno" aria-label="Color de relleno">▧</button>
        </div><small>Fuente</small></div>
        <div class="ribbon-group"><div>
          <select id="align" aria-label="Alineación"><option value="">Alineación</option><option value="left">Izquierda</option><option value="center">Centro</option><option value="right">Derecha</option></select>
          <button id="wrap" aria-pressed="false" title="Ajustar texto">Ajustar texto</button>
          <button id="borders" aria-pressed="false" title="Aplicar o quitar bordes">▦ Bordes</button>
        </div><small>Alineación y bordes</small></div>
        <div class="ribbon-group"><div><select id="format" aria-label="Formato numérico">
          <option value="">General</option><option value="currency">Moneda (USD)</option><option value="percent">Porcentaje</option>
          <option value="decimal">Decimal</option><option value="date">Fecha</option></select></div><small>Número</small></div>
        <div class="ribbon-group"><div><button data-tool="find" class="tool-tile"><b aria-hidden="true">⌕</b> Buscar</button>
          <button id="clear" class="tool-tile" title="Borrar contenido"><b aria-hidden="true">◇</b> Borrar</button></div><small>Edición</small></div>
      </div>
      <div class="ribbon-panel" data-panel="insert" hidden>
        <div class="ribbon-group"><button data-tool="chart" class="tool-tile"><b aria-hidden="true">▥</b> Gráficas</button><small>Visualización</small></div>
      </div>
      <div class="ribbon-panel" data-panel="data" hidden>
        <div class="ribbon-group"><div><button data-tool="filter" class="tool-tile"><b aria-hidden="true">≡</b> Filtrar <span id="filter-count" hidden></span></button>
          <button data-tool="sort" class="tool-tile"><b aria-hidden="true">⇅</b> Ordenar</button></div><small>Ordenar y filtrar</small></div>
      </div>
      <div class="ribbon-panel" data-panel="view" hidden>
        <div class="ribbon-group"><div><button data-tool="view" class="tool-tile"><b aria-hidden="true">⊞</b> Paneles</button>
          <button id="range-mode" aria-pressed="false" title="Arrastrar para seleccionar con el dedo">Selección táctil</button>
          <button id="chart-toggle" aria-pressed="true">Gráficas en hoja</button></div><small>Visualización</small></div>
      </div>
    </div>
    <div id="cell-menu" class="palette context-menu" hidden aria-label="Acciones de celda">
      <button data-cell-action="copy">Copiar</button><button data-cell-action="cut">Cortar</button>
      <button data-cell-action="paste">Pegar</button><button data-cell-action="clear">Borrar contenido</button>
      <button data-cell-action="bold">Negrita</button><button data-cell-action="filter">Filtrar selección</button>
      <button data-cell-action="chart">Graficar selección</button>
    </div>
    <div id="palette" class="palette" hidden></div>
    <div class="formula">
      <input id="active-cell" aria-label="Ir a celda o rango" title="Escribe una dirección y pulsa Enter" value="A1" autocapitalize="characters" autocomplete="off">
      <label id="fx-label" for="fx">ƒx</label>
      <div id="fx" role="textbox" aria-labelledby="fx-label fx-caption" contenteditable="plaintext-only" spellcheck="false" inputmode="text"></div>
      <span id="fx-caption" class="sr-only">Barra de fórmulas</span>
      <div class="suggestions" id="suggestions" aria-label="Sugerencias de funciones" hidden></div>
    </div>
    <section id="grid" aria-label="Hoja de cálculo">
      <div class="scroll" aria-hidden="true"><div class="space"></div></div>
      <canvas tabindex="0" aria-label="Cuadrícula. Usa las flechas para navegar, y F2 para editar." aria-describedby="grid-status"></canvas>
      <div id="sheet-charts" aria-label="Gráficas de la hoja"></div>
      <input class="editor" aria-label="Editar celda" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
    </section>
    <footer>
      <div class="tabs" id="tabs" aria-label="Hojas"></div>
      <div class="status"><span id="grid-status" aria-live="polite">A1</span><div class="zoom-controls"><button id="zoom-out" aria-label="Reducir zoom">−</button>
        <input id="zoom" type="range" min="50" max="160" step="5" value="100" aria-label="Zoom de la hoja">
        <button id="zoom-in" aria-label="Aumentar zoom">+</button><button id="zoom-reset" title="Restablecer zoom">100%</button></div></div>
    </footer>
  </main>
  <dialog id="workbook-tools" aria-labelledby="tools-title">
    <form id="tools-form">
      <header class="dialog-header">
        <div><h2 id="tools-title"></h2><p id="tools-range"></p></div>
        <button type="button" id="tools-close" aria-label="Cerrar">×</button>
      </header>
      <div class="dialog-body">
        <label data-panel="filter sort">Columna <select id="tools-column"></select></label>
        <div data-panel="filter" class="tool-fields">
          <label>Condición <select id="tools-condition"><option value="contains">Contiene</option><option value="not-contains">No contiene</option><option value="equals">Es igual a</option><option value="gt">Mayor que</option><option value="gte">Mayor o igual</option><option value="lt">Menor que</option><option value="lte">Menor o igual</option><option value="empty">Está vacía</option><option value="nonempty">Tiene contenido</option></select></label>
          <label>Valor <input id="tools-query" autocomplete="off"></label>
        </div>
        <div data-panel="sort" class="tool-fields">
          <label>Orden <select id="tools-order"><option value="asc">Ascendente</option><option value="desc">Descendente</option></select></label>
          <label class="check"><input id="tools-header" type="checkbox" checked> La primera fila contiene encabezados</label>
        </div>
        <div data-panel="find" class="tool-fields">
          <label>Buscar <input id="tools-find" autocomplete="off"></label>
          <label class="check"><input id="tools-raw" type="checkbox"> Buscar en fórmulas y texto original</label>
          <div class="tool-actions"><button type="button" id="tools-prev">Anterior</button><button type="button" id="tools-next">Siguiente</button></div>
          <label>Reemplazar en el contenido original <input id="tools-replacement" autocomplete="off"></label>
          <button type="button" id="tools-replace-all">Reemplazar todas las coincidencias</button>
        </div>
        <div data-panel="chart" class="tool-fields">
          <label>Origen <select id="tools-chart-source"></select></label>
          <div class="tool-actions">
            <label>Título <input id="tools-chart-title" autocomplete="off"></label>
            <label>Tipo <select id="tools-chart-type"><option value="bar">Columnas</option><option value="line">Líneas</option><option value="scatter">Dispersión XY</option><option value="pie">Circular</option></select></label>
          </div>
          <div id="tools-chart-content" class="chart-content"></div>
          <div class="tool-actions"><button type="button" id="tools-save-chart">Guardar selección como gráfica</button><button type="button" id="tools-delete-chart">Quitar gráfica guardada</button></div>
        </div>
        <div data-panel="view" class="tool-fields">
          <label class="check"><input id="freeze-row" type="checkbox"> Inmovilizar primera fila</label>
          <label class="check"><input id="freeze-col" type="checkbox"> Inmovilizar primera columna</label>
          <label class="check"><input id="show-hidden" type="checkbox"> Mostrar filas ocultas del archivo original</label>
        </div>
        <p id="tools-message" role="status"></p>
        <div class="tool-actions">
          <button id="tools-clear-filter" type="button" hidden>Quitar todos los filtros</button>
          <button id="tools-remove-rule" data-panel="filter" type="button" hidden>Quitar filtro de esta columna</button>
          <button id="tools-apply" class="export" type="submit" hidden></button>
        </div>
      </div>
    </form>
  </dialog>
</body>
</html>
